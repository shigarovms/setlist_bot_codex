<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>setListBot — редактор</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">setListBot</div>
        <h1 id="heading">Личный черновик</h1>
        <p id="event"></p>
        <div class="timing">
          <strong id="total">00:00</strong><span id="planned"></span>
        </div>
      </header>
      <p id="status" role="status" aria-live="polite">Загрузка…</p>
      <button id="access-request" hidden>Запросить права у владельца</button>
      <nav id="history" aria-label="Версии и прошлые выступления">
        <button id="older" aria-label="Предыдущий сет-лист">← прошлые</button
        ><span id="history-label"></span
        ><button id="newer" aria-label="Следующий сет-лист" disabled>
          →
        </button>
      </nav>
      <button id="use-history" hidden>Взять за основу</button>
      <div class="toolbar">
        <button id="undo" disabled>↶ Отменить</button
        ><button id="average-pause" disabled>Сред. пауза</button
        ><button id="add-pause">＋ Пауза</button>
      </div>
      <div class="workspace">
        <section aria-label="Ваш сет-лист">
          <ol id="setlist"></ol>
          <p id="empty" hidden></p>
          <button id="add-pause-bottom" type="button" disabled>+ пауза</button>
        </section>
        <section id="catalog">
          <h2 id="catalog-heading">Репертуар</h2>
          <label id="search-label" for="search">Поиск песни</label
          ><input
            id="search"
            type="search"
            autocomplete="off"
            enterkeyhint="done"
            placeholder="Название песни"
          />
          <div id="catalog-list"></div>
          <button id="add-song" type="button">＋ Добавить песню</button>
          <nav class="pages">
            <button id="page-prev" aria-label="Предыдущая страница">◀</button
            ><span id="page-label"></span
            ><button id="page-next" aria-label="Следующая страница">▶</button>
          </nav>
        </section>
      </div>
      <footer>
        <p id="private-note">Сохраняется только личный черновик.</p>
        <button id="publish" class="primary" disabled>
          📤 Предложить в группу и закрыть
        </button>
        <button id="save" disabled>Сохранить черновик</button
        ><button id="back-bot">Вернуться к боту</button>
      </footer>
    </main>
    <dialog id="song-dialog">
      <form id="song-form">
        <h2 id="song-dialog-title">Редактировать песню</h2>
        <p id="song-scope">Изменения относятся к репертуару коллектива.</p>
        <label id="song-title-label" for="song-title">Название *</label>
        <input id="song-title" maxlength="200" required />
        <label id="song-duration-label" for="song-duration">Длительность ММ:СС *</label>
        <input id="song-duration" maxlength="8" placeholder="03:20" pattern="[0-9]{1,5}:[0-5][0-9]" required />
        <label for="song-bpm">BPM</label>
        <input id="song-bpm" type="number" min="1" max="1000" step="1" />
        <label id="song-lights-label" for="song-lights">Цвета / свет</label>
        <textarea id="song-lights" maxlength="2000" rows="2"></textarea>
        <label id="song-comment-label" for="song-comment">Комментарий</label>
        <textarea id="song-comment" maxlength="2000" rows="2"></textarea>
        <label id="song-aliases-label" for="song-aliases">Альтернативные названия — по одному на строку</label>
        <textarea id="song-aliases" maxlength="20100" rows="2"></textarea>
        <p id="song-error" role="alert"></p>
        <div class="toolbar">
          <button id="song-cancel" type="button">Отмена</button>
          <button id="song-reload" type="button" hidden>Загрузить актуальную</button>
          <button id="song-submit" class="primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>
    <dialog id="pause-dialog">
      <form id="pause-form">
        <h2 id="pause-title">Длительность паузы</h2>
        <label id="pause-text-label" for="pause-text">Текст паузы — можно оставить пустым</label>
        <textarea id="pause-text" maxlength="1000" rows="3"></textarea>
        <label id="pause-label" for="pause-value">Без единиц — минуты</label
        ><input
          id="pause-value"
          type="text"
          maxlength="80"
          placeholder="3 мин / 2:30 / 00:00:03"
          required
        />
        <div class="toolbar">
          <button id="pause-cancel" type="button">Отмена</button
          ><button id="pause-submit" class="primary" type="submit">
            Добавить
          </button>
        </div>
        <p id="pause-error" role="alert"></p>
      </form>
    </dialog>
    <dialog id="average-dialog">
      <form id="average-form">
        <h2 id="average-title">Средняя пауза между песнями</h2>
        <label id="average-label" for="average-value">В секундах. 0 — без пауз. Отдельные паузы сохраняются.</label>
        <input id="average-value" type="number" inputmode="numeric" min="0" max="86400" step="1" required />
        <div class="toolbar">
          <button id="average-cancel" type="button">Отмена</button>
          <button id="average-submit" class="primary" type="submit">Применить</button>
        </div>
      </form>
    </dialog>
    <dialog id="conflict-dialog">
      <h2 id="conflict-title">Черновик изменён</h2>
      <p id="conflict-note"></p>
      <pre id="latest-list"></pre>
      <button id="load-latest">Загрузить актуальный</button
      ><button id="copy-own">Скопировать мой список</button
      ><button id="conflict-close">Продолжить мой ввод</button>
    </dialog>
  </body>
</html>
