[project]
name = "setlist-bot"
version = "0.1.0"
description = "Telegram setlists for musical groups"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4",
  "aiohttp>=3.14,<4",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "rapidfuzz>=3.12,<4",
  "Unidecode>=1.3,<2",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pypdf>=6,<7",
    "types-reportlab>=4,<5",
]

[project.scripts]
setlist-bot = "setlist_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["setlist_bot"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"src/setlist_bot/transport/i18n.py" = ["E501"]
# Server-rendered HTML literals are easier to review without artificial line breaks.
"src/setlist_bot/admin/views.py" = ["E501"]
"src/setlist_bot/admin/app.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/setlist_bot"]
